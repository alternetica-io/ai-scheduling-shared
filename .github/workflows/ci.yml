# Tipos y tests del paquete de contratos (orch #35). Es del que dependen la
# web y el móvil, y era el único de los repos sin red: un cambio acá se
# descubría cuando fallaba un consumidor, no donde estaba el error.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Typecheck + tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test
